name: Monthly link check

on:
  schedule:
    - cron: '17 4 1 * *' # 04:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify every source URL
        run: npm run verify-links | tee link-report.txt

      - name: Summary
        run: |
          {
            echo '## Link check'
            echo '```'
            cat link-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated statuses
        id: commit
        run: |
          if git diff --quiet data/documents.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "open-lemma-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/documents.json
          git commit -m "chore: monthly link check $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  redeploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
