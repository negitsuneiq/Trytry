name: Monthly link check

on:
  schedule:
    - cron: '17 4 1 * *' # 04:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify every source URL
        shell: bash
        run: |
          set -o pipefail
          npm run verify-links | tee link-report.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Link check'
            echo '```'
            cat link-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated statuses
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          # last_checked alone (it moves on every successful check) must not cause a commit and a redeploy.
          if [ "$(npx tsx scripts/docs-changed.ts)" = "unchanged" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "open-lemma-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/documents.json
          git commit -m "chore: monthly link check $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

  redeploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
